# Nginx Reverse Proxy Configuration Template for HireGenius Auth Service
# Location on Amazon Linux 2023 EC2: /etc/nginx/conf.d/hiregenius-auth.conf

# Rate Limiting Zone Definition
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Upstream Server Definition for Spring Boot Docker Container
upstream auth_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server Block (Port 80) — Listens for HTTP & ACME Webroot challenge
server {
    listen 80;
    listen [::]:80;
    server_name auth.yourdomain.com; # Replace with your actual domain or Elastic IP

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # HTTP to HTTPS Redirect (Certbot will auto-configure this block when run)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Port 443) — Reverse Proxy to Spring Boot Container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.yourdomain.com; # Replace with your actual domain

    # SSL Certificates (Uncomment after running certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/auth.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size
    client_max_body_size 10M;

    # Proxy Configuration to Spring Boot Auth Service
    location / {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://auth_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Direct Health Check Route
    location /actuator/health {
        proxy_pass http://auth_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://auth_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
