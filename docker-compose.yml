version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hiregenius_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: hiregenius_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./hiregenius-auth-service
      dockerfile: Dockerfile
    container_name: hiregenius_auth_service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  core-api:
    build:
      context: ./hiregenius-core-api
      dockerfile: Dockerfile
    container_name: hiregenius_core_api
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  ai-ml-service:
    build:
      context: ./hiregenius-ai-ml-service
      dockerfile: Dockerfile
    container_name: hiregenius_ai_ml_service
    environment:
      - MONGO_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      - GEMINI_API_KEY_TEST=${GEMINI_API_KEY_TEST}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./hiregenius-frontend
      dockerfile: Dockerfile
    container_name: hiregenius_frontend
    environment:
      - VITE_CORE_API_URL=http://localhost:3000
      - VITE_AUTH_SERVICE_URL=http://localhost:8080
    ports:
      - "80:8080"
    depends_on:
      core-api:
        condition: service_healthy
      auth-service:
        condition: service_healthy

volumes:
  mysql_data:
  mongo_data:
