server:
  port: 0

spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test_jwt_signing_key_that_is_at_least_256_bits_long_for_unit_tests_and_mock_suite
    expiration-ms: 3600000
  firebase:
    credentials-path: ''
    credentials-json: ''
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.hiregenius.authservice: INFO
