# Test Datasource Configuration (H2 in MySQL-compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# App Test Settings
app.jwt.secret=test_jwt_signing_key_that_is_at_least_256_bits_long_for_unit_tests_and_mock_suite
app.jwt.expiration-ms=3600000
app.firebase.credentials-path=
app.firebase.credentials-json=
