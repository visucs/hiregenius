server:
  port: ${PORT:8080}

spring:
  application:
    name: auth-service
  mvc:
    servlet:
      load-on-startup: 1
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hiregenius?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:supersecret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 240000
      connection-timeout: 20000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: ${MAIL_FROM:krvisuji92@gmail.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://hiregenius-delta.vercel.app}
  email-validation:
    mx-check-enabled: ${EMAIL_MX_CHECK_ENABLED:true}
  jwt:
    # 256-bit+ secret key configured via environment variable
    secret: ${JWT_SIGNING_KEY:my_super_secret_jwt_signing_key_that_is_long_enough_for_hs256}
    # Token expiration in milliseconds (default: 24h = 86400000ms)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  firebase:
    # Path to serviceAccountKey.json or raw JSON content from environment
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:80,http://localhost:3000}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.hiregenius.authservice: DEBUG
    org.springframework.security: INFO
