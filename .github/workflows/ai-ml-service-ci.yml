name: AI/ML Service CI/CD

on:
  push:
    branches: [ main, dev, 'feature/**' ]
    paths:
      - 'hiregenius-ai-ml-service/**'
      - '.github/workflows/ai-ml-service-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'hiregenius-ai-ml-service/**'
      - '.github/workflows/ai-ml-service-ci.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ai-ml-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hiregenius-ai-ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './hiregenius-ai-ml-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: App import and initialization smoke test
        run: |
          python -c "import app.main; print('Successfully imported app.main')"
          python -c "from app.main import app; from app.config import settings; assert app.title == 'HireGenius AI/ML Service'; assert settings.PORT == 8000; print('App configuration verified on port:', settings.PORT)"

      - name: Test Docker build
        run: |
          docker build -t hiregenius-ai-ml-service:ci-test .

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./hiregenius-ai-ml-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
