name: Deploy Auth Service to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'hiregenius-auth-service/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Get runner IP
        run: echo "RUNNER_IP=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_ENV

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-011d4a518af48aa67 \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32

      - name: Wait for Security Group propagation
        run: sleep 10

      - name: Deploy via SSH to AWS EC2 (Amazon Linux 2023)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          timeout: 60s
          command_timeout: 20m
          script: |
            echo "=========================================="
            echo "Connected to AWS EC2 Server (Amazon Linux 2023)"
            echo "=========================================="
            
            # Locate hiregenius-auth-service directory on host
            if [ -d "/var/www/hiregenius/hiregenius-auth-service" ]; then
              cd /var/www/hiregenius/hiregenius-auth-service
            elif [ -d "$HOME/hiregenius/hiregenius-auth-service" ]; then
              cd "$HOME/hiregenius/hiregenius-auth-service"
            elif [ -d "$HOME/hiregenius-auth-service" ]; then
              cd "$HOME/hiregenius-auth-service"
            elif [ -d "/var/www/hiregenius" ]; then
              cd /var/www/hiregenius
            elif [ -d "$HOME/hiregenius" ]; then
              cd "$HOME/hiregenius"
            else
              echo "ERROR: Project directory not found on EC2 host."
              exit 1
            fi

            echo "Working Directory: $(pwd)"
            chmod +x deploy.sh
            ./deploy.sh

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-011d4a518af48aa67 \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32
